name: Instaladores multiplataforma v2

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag de la candidata a publicar
        default: v2.0.0-rc.1
        required: true
      existing_run_id:
        description: Run anterior con Android y Windows listos (opcional)
        default: ''
        required: false
  push:
    tags:
      - 'v2.*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'
  RELEASE_VERSION: '2.0.0-rc.1'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    if: inputs.existing_run_id == ''
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --no-pub
      - run: flutter build appbundle --release --no-pub
      - name: Nombrar paquetes sin firma de producción
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/CGID_${RELEASE_VERSION}_Android_debug-signed.apk
          cp build/app/outputs/bundle/release/app-release.aab release/CGID_${RELEASE_VERSION}_Android_debug-signed.aab
      - uses: actions/upload-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Android
          path: release/*
          if-no-files-found: error

  windows:
    if: inputs.existing_run_id == ''
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --no-pub
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Crear EXE instalable y ZIP portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:RELEASE_VERSION" tool/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "release/CGID_${env:RELEASE_VERSION}_Windows_x64_portable.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Windows
          path: release/*
          if-no-files-found: error

  apple:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar macOS sin firma de distribución
        run: flutter build macos --release --no-pub
      - name: Crear DMG macOS
        run: |
          mkdir -p release/dmg
          cp -R build/macos/Build/Products/Release/*.app release/dmg/
          ln -s /Applications release/dmg/Applications
          hdiutil create -volname CGID -srcfolder release/dmg -ov -format UDZO "release/CGID_${RELEASE_VERSION}_macOS_unsigned.dmg"
      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign --no-pub
      - name: Empaquetar aplicación iOS para firma posterior
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "release/CGID_${RELEASE_VERSION}_iOS_unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Apple-unsigned
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  linux-experimental:
    needs: quality
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - name: Instalar bibliotecas nativas
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libmpv-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generar runner Linux
        run: flutter create --platforms=linux --project-name cgid .
      - run: flutter build linux --release --no-pub
      - name: Empaquetar bundle Linux
        run: |
          mkdir -p release
          tar -czf "release/CGID_${RELEASE_VERSION}_Linux_x64_experimental.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Linux-experimental
          path: release/*
          if-no-files-found: error

  web:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href / --no-pub --no-wasm-dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Web-PWA
          path: build/web/
          if-no-files-found: error

  github-release:
    if: >-
      ${{ always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') &&
          (needs.android.result == 'success' || inputs.existing_run_id != '') &&
          (needs.windows.result == 'success' || inputs.existing_run_id != '') &&
          needs.apple.result == 'success' &&
          needs.web.result == 'success' }}
    needs: [android, windows, apple, linux-experimental, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Android
          path: dist
          run-id: ${{ inputs.existing_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Windows
          path: dist
          run-id: ${{ inputs.existing_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Apple-unsigned
          path: dist
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: CGID-${{ env.RELEASE_VERSION }}-Linux-experimental
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_ref || github.ref_name }}
          prerelease: ${{ contains(inputs.release_ref || github.ref_name, '-rc.') }}
          generate_release_notes: true
          body: |
            Compilación candidata v2.0 sin firma de distribución.

            - Android usa temporalmente la clave de depuración y se distribuye sólo para pruebas directas.
            - Windows y macOS pueden mostrar advertencias del sistema por editor no verificado.
            - iOS requiere firma de Apple antes de poder instalarse en dispositivos.
            - Linux es experimental: las funciones de Firebase/Auth/Firestore no están disponibles de forma nativa.
          files: dist/**

