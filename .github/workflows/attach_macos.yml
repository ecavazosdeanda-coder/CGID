name: Adjuntar instalador macOS
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Ejecución verificada de Instaladores v1.0
        required: true
        default: '36767413733'
permissions:
  actions: read
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macOS-v1.0
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: installer
      - name: Verificar y adjuntar DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo '7fdfb51424972eb9ad68baeeaec26d68a740a24d6060517fb186cfd3f800db1a  installer/CGID_v1.0_macos.dmg' | sha256sum --check
          gh release upload v1.0 installer/CGID_v1.0_macos.dmg
