name: Validar CGDI v2

on:
  workflow_dispatch:
  push:
    branches: [dev-v2]
  pull_request:
    branches: [dev-v2]

permissions:
  contents: read

concurrency:
  group: cgdi-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-pub

      - name: Pruebas automatizadas
        run: flutter test --no-pub

      - name: Compilar PWA
        run: flutter build web --release --base-href / --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: CGDI-v2-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14
