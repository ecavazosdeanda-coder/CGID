name: Validar CGDI v2

on:
  workflow_dispatch:
  push:
    branches: [dev-v2]
  pull_request:
    branches: [dev-v2]

permissions:
  contents: read

concurrency:
  group: cgdi-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-pub

      - name: Pruebas automatizadas
        run: flutter test --no-pub

      - name: Compilar PWA
        run: flutter build web --release --base-href / --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: CGDI-v2-web-${{ github.sha }}
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  backend-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependencias de backend
        working-directory: functions
        run: npm ci

      - name: Compilar Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Pruebas unitarias de Cloud Functions
        working-directory: functions
        run: npm run test:functions

      - name: Pruebas de reglas en emulador Firestore
        run: firebase emulators:exec --only firestore "npm --prefix functions run test:rules"

